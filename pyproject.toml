[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-quest"
version = "1.9.1"
description = "A cyberpunk terminal RPG for learning Bash, Git, Docker, Postgres, Vim, SSH, Python, Regex, Linux, Kubernetes, AWS, and Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thorski1" }]
keywords = [
    "terminal", "game", "rpg", "hacker", "cyberpunk", "bash", "linux",
    "git", "docker", "kubernetes", "aws", "terraform", "learning", "education", "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Education",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=13.0.0",
    "quest-engine>=1.5.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "jinja2>=3.0.0",
    "python-multipart>=0.0.6",
]

[project.urls]
Homepage      = "https://github.com/thorski1/nexus-quest"
Repository    = "https://github.com/thorski1/nexus-quest"
"Bug Tracker" = "https://github.com/thorski1/nexus-quest/issues"

[project.scripts]
nexus-quest      = "nexus_quest.main:main_nexus"
terminal-quest   = "nexus_quest.main:main_bash"
ssh-quest        = "nexus_quest.main:main_ssh"
vim-quest        = "nexus_quest.main:main_vim"
git-quest        = "nexus_quest.main:main_git"
docker-quest     = "nexus_quest.main:main_docker"
postgres-quest   = "nexus_quest.main:main_postgres"
python-quest     = "nexus_quest.main:main_python"
regex-quest      = "nexus_quest.main:main_regex"
linux-quest      = "nexus_quest.main:main_linux"
kubernetes-quest = "nexus_quest.main:main_kubernetes"
aws-quest        = "nexus_quest.main:main_aws"
terraform-quest  = "nexus_quest.main:main_terraform"
networking-quest = "nexus_quest.main:main_networking"
security-quest   = "nexus_quest.main:main_security"
cicd-quest       = "nexus_quest.main:main_cicd"
observability-quest = "nexus_quest.main:main_observability"
databases-quest    = "nexus_quest.main:main_databases"
golang-quest       = "nexus_quest.main:main_golang"
api-design-quest   = "nexus_quest.main:main_api_design"
rust-quest         = "nexus_quest.main:main_rust"
system-design-quest = "nexus_quest.main:main_system_design"
typescript-quest    = "nexus_quest.main:main_typescript"
data-engineering-quest = "nexus_quest.main:main_data_engineering"
shell-scripting-quest = "nexus_quest.main:main_shell_scripting"
cloud-native-quest   = "nexus_quest.main:main_cloud_native"
web-dev-quest        = "nexus_quest.main:main_web_dev"

[tool.setuptools.packages.find]
where   = ["."]
include = ["nexus_quest*"]

[tool.setuptools.package-data]
nexus_quest = ["skill-packs/**/*.py", "skill-packs/**/*.json", "skill-packs/**/*.md"]
